<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurevoo</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-color:#000;
            font-family:Arial, sans-serif;
            overflow:hidden;
        }

        /* Immagine a schermo intero senza tagli */
        .background{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;

            background-image:url('aurevoo.jpeg');
            background-size:contain;
            background-position:center center;
            background-repeat:no-repeat;
            background-color:#000;

            z-index:1;
        }

        /* Contenuto sovrapposto */
        .overlay{
            position:fixed;
            top:0;
            left:0;

            width:100%;
            height:100%;

            display:flex;
            justify-content:center;
            align-items:center;

            z-index:2;
        }

        .box{
            background:rgba(0,0,0,0.65);
            padding:30px 40px;
            border-radius:20px;
            text-align:center;
            backdrop-filter:blur(5px);
            max-width:600px;
        }

        h1{
            font-size:60px;
            margin-bottom:20px;
        }

        p{
            font-size:24px;
            line-height:1.5;
        }

        .construction{
            margin-top:20px;
            font-size:28px;
            font-weight:bold;
        }

        @media(max-width:768px){

            h1{
                font-size:40px;
            }

            p{
                font-size:18px;
            }

            .construction{
                font-size:22px;
            }

            .box{
                width:90%;
                padding:20px;
            }
        }

    </style>
</head>

<body>

    <div class="background"></div>

    <div class="overlay">
        <div class="box">
            <h1>Aurevoo</h1>

            <p>
                Occhiali smart per persone ipoacusiche.
                Il futuro inizia qui!
            </p>

            <div class="construction">
                🚧 Sito in costruzione 🚧
            </div>
        </div>
    </div>

</body>
</html>
